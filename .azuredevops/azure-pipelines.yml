trigger:
  branches:
    include: [main]

stages:
  - stage: PlanDev
    jobs:
      - job: plan
        pool: { vmImage: ubuntu-latest }
        steps:
          - task: TerraformInstaller@1
          - script: |
              cd environments/dev
              terraform init -backend=false
              terraform plan -out=tfplan
            displayName: Plan dev

  - stage: ApplyDev
    dependsOn: PlanDev
    jobs:
      - deployment: dev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "terraform apply dev (approved auto)"
                  displayName: Apply dev

  - stage: PlanStaging
    dependsOn: ApplyDev
    jobs:
      - job: plan
        pool: { vmImage: ubuntu-latest }
        steps:
          - script: cd environments/staging && terraform init -backend=false && terraform plan
            displayName: Plan staging

  - stage: ApplyStaging
    dependsOn: PlanStaging
    jobs:
      - deployment: staging
        environment: staging-approval
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "terraform apply staging"
                  displayName: Apply staging

  - stage: ApplyProd
    dependsOn: ApplyStaging
    jobs:
      - deployment: prod
        environment: prod-approval
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "terraform apply prod"
                  displayName: Apply prod
